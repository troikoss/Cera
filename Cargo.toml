[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
glib-build-tools = "0.22.8"
tracing = "0.1.44"
# No `env-filter`: `Targets` parses `RUST_LOG=cera=debug` without pulling in regex.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
