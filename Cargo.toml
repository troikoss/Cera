[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
cera-core = { path = "crates/core" }
cera-render = { path = "crates/render" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
glib-build-tools = "0.22.8"
glib = "0.22.10"
cairo = { package = "cairo-rs", version = "0.22.9" }
async-channel = "2.5.0"
poppler = { package = "poppler-rs", version = "0.26.0", features = ["v0_82"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
crc32fast = "1.5.3"
memmap2 = "0.9.12"
thiserror = "2.0.21"
anyhow = "1.0.104"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tracing = "0.1.44"
# No `env-filter`: `Targets` parses `RUST_LOG=cera=debug` without pulling in regex.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
