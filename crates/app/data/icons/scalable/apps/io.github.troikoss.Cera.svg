<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="frame" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b5835a"/>
      <stop offset="1" stop-color="#865e3c"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3a2717"/>
      <stop offset="1" stop-color="#22160c"/>
    </linearGradient>
    <linearGradient id="stylus" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>
  <!-- Tablet: a wooden frame with dark wax, the bottom edge showing its thickness. -->
  <rect width="112" height="100" x="8" y="18" fill="#63452c" rx="12"/>
  <rect width="112" height="96" x="8" y="14" fill="url(#frame)" rx="12"/>
  <rect width="92" height="76" x="18" y="24" fill="url(#wax)" rx="5"/>
  <!-- Writing scratched into the wax. -->
  <g fill="none" stroke="#f6d32d" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M28 44c4-8 8-8 10 0s6 8 10 0 7-8 10 0 6 6 10-2"/>
    <path d="M28 62c4-7 7-7 9 0s6 7 9 0 6-7 9 0"/>
    <path d="M28 80c3-5 6-5 8 0s5 5 7 0"/>
  </g>
  <!-- Stylus lying across the tablet. -->
  <g transform="rotate(-38 94 70)">
    <rect width="12" height="76" x="88" y="26" fill="url(#stylus)" rx="6"/>
    <path fill="#9a9996" d="M88 98h12l-6 18z"/>
    <path fill="#5e5c64" d="M92.4 110h3.2L94 116z"/>
    <rect width="12" height="6" x="88" y="34" fill="#c64600" rx="1"/>
  </g>
</svg>
